name: Agentic CI - Self-Improving Test Runner

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  agentic-test-and-improve:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install pytest pytest-json-report psutil

      - name: Run agentic test runner
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/agentic_test_runner.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentic-ci-reports
          path: |
            .jules/agentic_performance_log.json
            .jules/agentic_learnings.md
